server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;

    location /health {
        proxy_pass http://api:8000;
    }

    location /ready {
        proxy_pass http://api:8000;
    }

    location /investigations {
        proxy_pass http://api:8000;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
